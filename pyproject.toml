[project]
name = "cited-clinical-assistant"
version = "0.2.0"
description = "Research demo: answers mental-health clinical questions from PubMed with citations. Not medical advice."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# MCP server + HTTP API + chatbot
serve = ["mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "gradio>=5"]
# SapBERT embedder for the overlap check
overlap = ["torch", "transformers>=4.40"]

[project.scripts]
cca-mcp = "cca.interfaces.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
